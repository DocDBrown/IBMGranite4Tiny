services:
  granite-4-tiny:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: "1.88.0"
        APP_NAME: "granite-4-tiny"
        MODEL_FILE: "granite-4.0-h-tiny-Q8_0.gguf"
    init: true
    restart: unless-stopped
    ports:
      - "3666:3000"
    environment:
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "3000"
      MODEL_PATH: "/models/granite-4.0-h-tiny-Q8_0.gguf"
      LLAMA_SERVER_PATH: "/usr/local/bin/llama-server"
      LLAMA_HOST: "127.0.0.1"
      LLAMA_PORT: "3000"
      CTX: "8192"
      N_GPU_LAYERS: "0"
      # readiness tuning
      LLAMA_READY_TIMEOUT_SECS: "1800"
      LLAMA_READY_POLL_MS: "250"
